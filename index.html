<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الذكاء — 50 سؤالاً</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF8F2;
    --paper2:#F4EFE5;
    --ink:#23201B;
    --ink-soft:#5E584D;
    --line:#E4DCCB;
    --accent:#B4552D;
    --accent-deep:#8F3F1E;
    --olive:#6E7B5E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:'Cairo',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    line-height:1.8;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(#00000008 1px, transparent 1px);
    background-size:22px 22px;
  }

  .wrap{
    max-width:640px;margin:0 auto;min-height:100vh;
    display:flex;flex-direction:column;padding:24px 20px 48px;
  }

  .screen{display:none;flex:1;flex-direction:column;animation:fade .5s ease both}
  .screen.active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;text-align:center}
  .kicker{
    display:inline-block;margin:0 auto;font-size:.8rem;letter-spacing:2px;
    color:var(--accent);border:1px solid var(--line);padding:6px 18px;border-radius:999px;
    background:#fff;
  }
  h1{font-family:'Amiri',serif;font-size:clamp(2.2rem,8vw,3.2rem);font-weight:700;line-height:1.4}
  h1 em{font-style:italic;color:var(--accent-deep)}
  .lead{color:var(--ink-soft);font-size:1.02rem;max-width:46ch;margin:0 auto}
  .btn{
    font-family:'Cairo',sans-serif;font-weight:700;font-size:1.05rem;cursor:pointer;
    background:var(--ink);color:var(--paper);border:none;border-radius:14px;
    padding:16px 44px;transition:transform .15s ease, background .2s;
    box-shadow:0 6px 18px #23201b22;margin:8px auto 0;display:block;
  }
  .btn:hover{background:var(--accent-deep);transform:translateY(-2px)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
  .legend{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:28px;text-align:right;
  }
  .legend div{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;font-size:.85rem;color:var(--ink-soft);
  }
  .legend b{color:var(--ink)}
  footer{margin-top:auto;text-align:center;font-size:.75rem;color:#A79E8D;padding-top:40px}

  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .counter{font-family:'Amiri',serif;font-size:1.3rem;white-space:nowrap}
  .bar{flex:1;height:6px;background:var(--paper2);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1)}
  .axis-tag{
    font-size:.75rem;color:var(--olive);font-weight:700;letter-spacing:.5px;
    margin-bottom:6px;
  }
  .q-card{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:26px 24px;box-shadow:0 4px 14px #23201b0d;
  }
  .question{font-family:'Amiri',serif;font-size:clamp(1.25rem,4.5vw,1.5rem);font-weight:700;line-height:1.9;margin-bottom:22px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    font-family:'Cairo',sans-serif;font-size:.98rem;text-align:right;cursor:pointer;
    background:var(--paper);border:1.5px solid var(--line);border-radius:12px;
    padding:14px 18px;display:flex;align-items:center;gap:12px;
    transition:border-color .15s, background .15s, transform .1s;color:var(--ink);
  }
  .opt .dot{
    width:16px;height:16px;border-radius:50%;border:2px solid #C9BFA8;flex-shrink:0;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--accent)}
  .opt.sel{background:#FDF3EC;border-color:var(--accent);font-weight:700}
  .opt.sel .dot{border-color:var(--accent);background:var(--accent)}
  .opt:active{transform:scale(.98)}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;min-height:52px}
  .link-btn{
    background:none;border:none;font-family:'Cairo',sans-serif;color:var(--ink-soft);
    cursor:pointer;font-size:.9rem;padding:10px 6px;
  }
  .link-btn:hover{color:var(--ink)}
  .btn.next{padding:13px 40px;margin:0}

  .result{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;text-align:center}
  .score-ring{position:relative;width:190px;height:190px;margin:0 auto}
  .score-ring svg{transform:rotate(-90deg)}
  .score-ring circle{fill:none;stroke-width:9;stroke-linecap:round}
  .ring-bg{stroke:var(--paper2)}
  .ring-fg{stroke:var(--accent);transition:stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1)}
  .score-num{
    position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    font-family:'Amiri',serif;
  }
  .score-num b{font-size:3rem;line-height:1}
  .score-num span{font-size:.85rem;color:var(--ink-soft)}
  .verdict{font-family:'Amiri',serif;font-size:1.5rem;font-weight:700;max-width:34ch;margin:0 auto}
  .again{background:none;border:1.5px solid var(--ink);color:var(--ink);
         box-shadow:none;margin-top:6px}
  .again:hover{background:var(--ink);color:var(--paper)}

  @media (min-width:700px){
    .legend{grid-template-columns:repeat(4,1fr)}
    .q-card{padding:34px 36px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ======== شاشة البداية ======== -->
  <section id="start" class="screen active">
    <div class="hero">
      <span class="kicker">اختبار تحليلي · ٥٠ سؤالاً</span>
      <h1>اكتشف <em>نمط تفكيرك</em> وذكاءك التحليلي</h1>
      <p class="lead">خمسون عبارة موزّعة على خمسة محاور: الرقمي، التنظيمي، النقدي، التجريدي، والعلمي. أجب بصدق وفق شعورك المعتاد — لا توجد إجابة صحيحة أو خاطئة.</p>

      <button class="btn" onclick="startQuiz()">ابدأ الاختبار</button>
    </div>
  </section>

  <!-- ======== شاشة الأسئلة ======== -->
  <section id="quiz" class="screen">
    <div class="topbar">
      <div class="counter" id="counter">١ / ٥٠</div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
    <div class="axis-tag" id="axisTag"></div>
    <div class="q-card">
      <div class="question" id="qText"></div>
      <div class="opts" id="opts"></div>
    </div>
    <div class="nav">
      <button class="link-btn" id="prevBtn" onclick="prevQ()">→ السابق</button>
      <button class="btn next" id="nextBtn" onclick="nextQ()" disabled>التالي</button>
    </div>
  </section>

  <!-- ======== شاشة النتيجة ======== -->
  <section id="result" class="screen">
    <div class="result">
      <span class="kicker">نتيجتك النهائية</span>
      <div class="score-ring">
        <svg width="190" height="190">
          <circle class="ring-bg" cx="95" cy="95" r="84"></circle>
          <circle class="ring-fg" id="ringFg" cx="95" cy="95" r="84"></circle>
        </svg>
        <div class="score-num"><b id="scoreNum">0</b><span>من 100</span></div>
      </div>
      <div class="verdict" id="verdict"></div>
      <button class="btn again" onclick="restart()">إعادة الاختبار</button>
    </div>
  </section>

</div>

<script>
/* ========== الأسئلة: 5 محاور × 10 ========== */
const AXES = [
  {name:"الذكاء الرقمي والحسابي", qs:[
    "أجد متعة كبيرة في إجراء العمليات الحسابية الذهنية السريعة دون استخدام الآلة الحاسبة.",
    "أستطيع تذكر الأرقام، التواريخ، أو أرقام الهواتف من خلال ربطها بأنماط رقمية معينة.",
    "تستهويني الألعاب والمسابقات التي تعتمد على الأرقام وحساب الاحتمالات.",
    "أنتبه بسرعة للأخطاء الحسابية في الفواتير أو المعاملات المالية قبل غيري.",
    "أستمتع بتحليل الإحصائيات والأرقام عند قراءة الأخبار أو التقارير الرياضية والاقتصادية.",
    "أجد أن مادة الرياضيات (أو المواد الرقمية) كانت أو لا تزال من أسهل المواد بالنسبة لي.",
    "أحب تقدير التكلفة المالية أو الأوزان والمسافات تقديراً تقريبياً ويكون تقديري قريباً من الواقع.",
    "تلفت انتباهي القوانين الرياضية والمعادلات وأسعى لفهم أصلها وتكوينها.",
    "عندما أواجه رقماً كبيراً، أميل لا شعورياً لتفكيكه أو البحث عن علاقة بين أرقامه.",
    "أستطيع حساب نسب مئوية أو حسومات تجارية بشكل سريع أثناء التسوق."
  ]},
  {name:"التنظيم والترتيب المنهجي", qs:[
    "أميل إلى تنظيم أفكاري ومهامي اليومية في قوائم مرتبة ومسلسلة حسب الأولوية.",
    "أشعر بالارتياح عندما تكون ملفات حاسوبي أو أشيائي الخاصة مصنفة في مجلدات واضحة.",
    "ألاحظ الأنماط والتكرار في التصاميم، السلوكيات، أو الأحداث بسرعة وسهولة.",
    "عندما أتعلم مفهوماً جديداً، أقوم بربطه مباشرة بقواعد أو تصنيفات سابقة في عقلي.",
    "أفضل استخدام الجداول، الرسوم البيانية، والمخططات الشجرية لتلخيص المعلومات المعقدة.",
    "يزعجني العشوائية وعدم التنظيم في طرح الأفكار أثناء النقاشات.",
    "أحب فرز الأشياء وتصنيفها (كتب، أدوات، ملفات) بناءً على معايير محددة (كالنوع، الحجم، أو الأهمية).",
    "أتبع خطوات محددة ومنتظمة (خطوة بخطوة) عند البدء في أي مشروع جديد.",
    "يسير يومي بشكل أفضل إذا وضعت له جدولاً زمنياً دقيقاً وموزعاً بالساعات.",
    "أستمتع بتفكيك الأجهزة أو الألعاب لمعرفة أجزائها الداخلية وكيف تترابط معاً."
  ]},
  {name:"التفكير النقدي وحل المشكلات", qs:[
    "عندما تواجهني مشكلة، أبحث أولاً عن أسبابها الجوهرية قبل التفكير في الحلول السطحية.",
    "أستمتع بحل الألغاز البوليسية أو ألعاب الذكاء التي تتطلب استكشاف الأدلة للوصول للحل.",
    "أستطيع التنبؤ بنهاية الأفلام أو الروايات بناءً على التحليل المنطقي لسياق الأحداث.",
    "أعتمد على لغة الأرقام والحقائق المثبتة لإقناع الآخرين بوجهة نظري بدلاً من العواطف.",
    "قبل اتخاذ أي قرار مصيري، أضع قائمة بالمميزات والعيوب وأدرسها بشكل حيادي.",
    "يسألني المحيطون بي دوماً للمساعدة في حل مشكلاتهم لأنهم يرونني عقلانياً ومحايداً.",
    "أستطيع كشف التناقضات في كلام الآخرين أو في التقارير التي أقرأها بسرعة.",
    "عندما أجد عطلاً في جهاز ما، أتبع أسلوب التجربة والاستبعاد المنظم لتحديد مكان الخلل.",
    "أستمتع بالألعاب الاستراتيجية التي تتطلب تخطيطاً طويل المدى مثل الشطرنج أو ألعاب المحاكاة.",
    "أرى العقبات والمشكلات بمثابة تحديات ممتعة لعقلي وليست مصدراً للإحباط."
  ]},
  {name:"السبب والنتيجة والتفكير التجريدي", qs:[
    "أهتم جداً بمعرفة الظواهر الطبيعية والعلمية ويسكنني فضول دائم لسؤال: لماذا حدث هذا؟",
    "أربط الأحداث اليومية ببعضها وفق مبدأ السبب والنتيجة دون الإيمان بالصدف المحضة.",
    "أستمتع بقراءة المقالات العلمية، الفيزيائية، أو الفلسفية التي تتناول المفاهيم التجريدية.",
    "يسهل عليّ استيعاب الرموز والمفاهيم الافتراضية (مثل لغات البرمجة، الرموز الكيميائية).",
    "أثق بالاستنتاجات القائمة على أدلة تجريبية أكثر من الأحاسيس الداخلية أو التخمينات.",
    "أستطيع الانتقال من قاعدة عامة لتطبيقها على جزيئات صغيرة بسهولة (التفكير الاستنباطي).",
    "تستهويني قراءة مواضيع الجدوى الاقتصادي، السلاسل الزمنية، والتوقعات المستندة لبيانات.",
    "أستوعب بسرعة كيف تؤثر التغيرات الصغيرة في مدخلات نظام معين على مخرجاته النهائية.",
    "أفضّل البرامج الوثائقية والتعليمية التي تفسر نشأة الكون والطبيعة على البرامج الترفيهية.",
    "أجد نفسي قادراً على صياغة فرضيات لتفسير المواقف الغامضة واختبار صحتها عملياً."
  ]},
  {name:"السلوك العلمي والتعلم الذكي", qs:[
    "يصفني الآخرون بأنني شخص: عقلاني، منطقي، وواقعي، في معظم مواقفي.",
    "أحب اختبار النظريات وتجربتها بنفسي للتأكد من دقتها وصحتها.",
    "أفهم التعليمات والكتالوجات التقنية للأجهزة الجديدة بسرعة وبدون تعقيد.",
    "عندما أدخل نقاشاً، أركز على نقطة الخلاف الأساسية وأرفض تشتيت الموضوع.",
    "أجد متعة في التعامل مع برمجيات الجداول والبيانات (مثل Excel) وتحليل مدخلاتها.",
    "أكره إطلاق الأحكام المتسرعة قبل جمع المعلومات الكافية ودراستها.",
    "أهتم بتعلم لغات البرمجة أو مبادئ الخوارزميات (Algorithms).",
    "يسهل عليّ التفريق بين «الرأي الشخصي» و«الحقيقة العلمية» في أحاديث الناس.",
    "تثير اهتمامي المقارنات المعيارية والإحصائية بين المنتجات أو الخدمات قبل الشراء.",
    "أشعر بالرضا الشديد عندما أنتهي من حل مسألة معقدة استغرقت مني وقتاً وجهداً في التفكير."
  ]}
];

/* نظام العلامات الجديد: الحد الأقصى = 50 × 2 = 100 */
const OPTIONS = [
  {label:"أبداً", v:0},
  {label:"أحياناً", v:0.5},
  {label:"غالباً", v:1},
  {label:"دائماً", v:2}
];

let flat = [], answers = [], idx = 0;

function buildFlat(){
  flat = [];
  AXES.forEach((a, ai) => a.qs.forEach(q => flat.push({axis: ai, text: q})));
}

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0});
}

function startQuiz(){
  buildFlat();
  answers = new Array(50).fill(null);
  idx = 0;
  show('quiz');
  renderQ();
}

const arNum = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

function renderQ(){
  const q = flat[idx];
  document.getElementById('counter').textContent = arNum(idx+1) + " / " + arNum(50);
  document.getElementById('barFill').style.width = (idx/50*100) + "%";
  document.getElementById('axisTag').textContent = "المحور: " + AXES[q.axis].name;
  document.getElementById('qText').textContent = q.text;

  const box = document.getElementById('opts');
  box.innerHTML = "";
  OPTIONS.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt' + (answers[idx] === o.v ? ' sel' : '');
    b.innerHTML = '<span class="dot"></span>' + o.label;
    b.onclick = () => {
      answers[idx] = o.v;
      box.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      document.getElementById('nextBtn').disabled = false;
      setTimeout(nextQ, 260);
    };
    box.appendChild(b);
  });

  document.getElementById('prevBtn').style.visibility = idx === 0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = idx === 49 ? "عرض النتيجة" : "التالي";
  document.getElementById('nextBtn').disabled = answers[idx] === null;
}

function nextQ(){
  if(answers[idx] === null) return;
  if(idx < 49){ idx++; renderQ(); }
  else showResult();
}

function prevQ(){ if(idx > 0){ idx--; renderQ(); } }

/* ========== النتيجة ========== */
function verdict(s){
  if(s >= 90) return "ذكاء تحليلي استثنائي — عقلك يعمل كمختبر متنقل";
  if(s >= 75) return "ذكاء تحليلي عالٍ جداً — تفكير منهجي وثاقب";
  if(s >= 60) return "ذكاء تحليلي متقدم — قاعدة قوية قابلة للتطوير";
  if(s >= 40) return "ذكاء تحليلي متوسط — لديك أساسيات جيدة";
  return "بداية الطريق — عقلك يمتلك إمكانيات تحتاج إلى تمرين";
}

function showResult(){
  /* العلامة النهائية = مجموع النقاط مباشرة (الحد الأقصى 100) */
  const score = Math.round(answers.reduce((a,b) => a + b, 0));

  show('result');
  document.getElementById('verdict').textContent = verdict(score);

  const C = 2 * Math.PI * 84;
  const ring = document.getElementById('ringFg');
  ring.style.strokeDasharray = C;
  ring.style.strokeDashoffset = C;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      ring.style.strokeDashoffset = C * (1 - score/100);
    });
  });

  let n = 0;
  const el = document.getElementById('scoreNum');
  const step = () => {
    n += Math.max(1, Math.ceil((score - n)/10));
    if(n >= score) n = score;
    el.textContent = arNum(n);
    if(n < score) setTimeout(step, 60);
  };
  step();
}

function restart(){ show('start'); }
</script>
</body>
</html>
